[package]
name = "trail"
version = "0.1.0"
edition = "2024"

[dependencies]
gix = { version = "0.90", default-features = false, features = ["revision", "blob-diff", "sha1"] }
imara-diff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.27"
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24"
